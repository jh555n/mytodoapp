name: dayweave
description: A local-first Todo and calendar app for iOS and Android.
publish_to: none
version: 0.1.0+1
environment:
  sdk: '>=3.5.0 <4.0.0'
  flutter: '>=3.47.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  sqflite: ^2.4.2
  path: ^1.9.1
  uuid: ^4.5.1
  flutter_local_notifications: ^19.5.0
  timezone: ^0.10.1
  flutter_timezone: ^4.1.1
  google_sign_in: ^6.3.0
  http: ^1.4.0
  xml: ^6.5.0
  flutter_secure_storage: ^9.2.4
  app_links: ^6.4.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  sqflite_common_ffi: ^2.3.6
flutter:
  uses-material-design: true
  assets:
    - assets/holidays/kr_2026.json
